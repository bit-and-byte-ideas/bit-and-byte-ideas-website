# Authoritative status for the website extension (work gallery + blog).
# Task documents hold detailed requirements; this file holds status. If they disagree on
# acceptance detail, the task document wins; on status, this file wins.
schema_version: 1
last_updated: 2026-10-12

objective: >-
  Extend bitandbyteideas.com (React 19 + React Router 8, statically prerendered on Azure
  Static Web Apps) with a customer work gallery (/work) and a technology blog (/blog),
  using validated Markdown content in the repository, preserving the existing
  "Engineered Dark" brand, URLs, and conversion paths, and leaving the site review-ready
  and deployable through the existing release workflow.

current_task: null # set to a task id while it is in_progress
next_task: WP-07 # recommended; WP-08 and WP-11 are also ready

status_values: [todo, ready, in_progress, blocked, done]

repository:
  branch: site-improvements
  base_revision: 4074b5e
  default_branch: main
  production_url: https://www.bitandbyteideas.com
  docs_root: docs/website

# Implementation completion (task status below) is tracked separately from real
# production content. Every task can reach `done` using labeled fixtures. These items are
# what the public site still needs. Item statuses: missing | supplied | in_review | published.
content_readiness:
  launch_behavior: >-
    Shipping with zero entries is safe: /work and /blog show deliberate empty states with
    noindex, and the nav, footer, sitemap, and homepage omit them (D-013, D-014). Each area
    becomes visible after its first published entry.
  checklist: docs/website/CONTENT.md#missing-asset-checklist
  items:
    - id: C-01
      item: Confirm /work + "Work" naming (BRIEF Q3) before the first project is published
      owner: Carlos
      status: missing
    - id: C-02
      item: At least one real project (kind, facts, case-study notes)
      owner: Carlos
      status: missing
    - id: C-03
      item: Written client approval with scope for each client project
      owner: Carlos
      status: missing
    - id: C-04
      item: Authentic screenshots (or URL plus permission to capture) for each project
      owner: Carlos
      status: missing
    - id: C-05
      item: At least one article reviewed and approved by Carlos (topic backlog in CONTENT.md)
      owner: Carlos
      status: missing
    - id: C-06
      item: Founder headshot for bylines (optional, BRIEF Q5)
      owner: Carlos
      status: missing
    - id: C-07
      item: Confirm the default share image (logo PNG) for entries without a cover
      owner: Carlos
      status: missing
    - id: C-08
      item: PRODUCT.md and llms.txt updated after first publication (AUDIT K11, K12)
      owner: WP-10 or the first publishing session
      status: missing

