# Project identification
sonar.projectKey=bitandbyte-website
sonar.projectName=Bit and Byte Ideas Website

# Source code location
sonar.sources=.

# Host URL (using default local SonarQube instance)
sonar.host.url=http://localhost:9000

# Login token (placeholder - will be provided by CI)
sonar.login=admin

# Project version
sonar.projectVersion=0.0.0

# JavaScript coverage report path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusion patterns
sonar.exclusions=node_modules/**,dist/**,.git/**,coverage/**,*.test.*,*.spec.*,**/*.test.*,**/*.spec.*,**/node_modules/**,**/build/**,**/dist/**